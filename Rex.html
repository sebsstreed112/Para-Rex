<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy of Love - REX</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Dancing+Script:wght@700&display=swap');

        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Great Vibes', cursive; touch-action: none; }
        
        #ui-layer {
            position: absolute; top: 5%; width: 100%; text-align: center;
            color: white; pointer-events: none; z-index: 10;
        }
        h1 { font-size: 4em; text-shadow: 0 0 20px #ff00ff; margin: 0; }
        .sub { font-size: 2em; color: #ff69b4; text-shadow: 0 0 10px #ff1493; margin-top: 5px; }

        #credits {
            position: fixed; bottom: 20px; right: 20px;
            color: rgba(255, 255, 255, 0.8); font-size: 1.2em;
            text-shadow: 0 0 5px #ff1493; z-index: 1000;
        }

        #btn-play {
            position: fixed; bottom: 30px; left: 30px; z-index: 1000;
            background: rgba(255, 20, 147, 0.8); color: white; border: 1px solid #fff;
            padding: 12px 24px; border-radius: 50px; cursor: pointer; font-weight: bold;
            font-family: 'Arial', sans-serif; backdrop-filter: blur(5px); transition: 0.3s;
        }
        #btn-play:hover { background: #ff1493; transform: scale(1.1); }
    </style>
</head>
<body>

    <div id="ui-layer">
        <h1>Te Amo Muchote</h1>
        <div class="sub">Para Mi Niña Hermosa</div>
    </div>

    <div id="credits">Creado con ❤️ por Sebastián</div>

    <button id="btn-play" onclick="toggleAudio()">🎵 REPRODUCIR: Contigo</button>
    <audio id="miMusica" loop>
        <source src="contigo.mp3" type="audio/mpeg">
    </audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        let sonido = document.getElementById('miMusica');
        function toggleAudio() {
            if (sonido.paused) { 
                sonido.play(); 
                document.getElementById('btn-play').innerText = "⏸ PAUSAR"; 
            } else { 
                sonido.pause(); 
                document.getElementById('btn-play').innerText = "▶️ REANUDAR"; 
            }
        }

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 2000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Estrellas de fondo
        const geoEstrellas = new THREE.BufferGeometry();
        const posEstrellas = [];
        for(let i=0; i<15000; i++) {
            posEstrellas.push((Math.random()-0.5)*1800, (Math.random()-0.5)*1800, (Math.random()-0.5)*1800);
        }
        geoEstrellas.setAttribute('position', new THREE.Float32BufferAttribute(posEstrellas, 3));
        scene.add(new THREE.Points(geoEstrellas, new THREE.PointsMaterial({color: 0xffffff, size: 1.2})));

        // Generador de Frases
        function crearTexturaFrase(texto) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 600; canvas.height = 150;
            const colores = ["#ff69b4", "#ff1493", "#ffffff", "#00ffff"];
            const colorElegido = colores[Math.floor(Math.random() * colores.length)];
            ctx.font = "italic bold 55px 'Dancing Script', cursive"; 
            ctx.textAlign = "center";
            ctx.shadowColor = colorElegido;
            ctx.shadowBlur = 15;
            ctx.fillStyle = "#ffffff";
            ctx.fillText(texto, 300, 75);
            return new THREE.CanvasTexture(canvas);
        }

        // Rosa definida
        function dibujarRosaDefinida(ctx, x, y, scale) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#ff00ff";
            ctx.strokeStyle = "#ff1493";
            ctx.lineWidth = 2;
            for (let i = 0; i < 6; i++) {
                ctx.beginPath(); ctx.rotate(Math.PI / 3); ctx.moveTo(0, 0);
                ctx.bezierCurveTo(15, -20, 35, -10, 0, 25);
                ctx.bezierCurveTo(-35, -10, -15, -20, 0, 0);
                ctx.fillStyle = "rgba(255, 20, 147, 0.5)"; ctx.fill(); ctx.stroke();
            }
            ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI * 2);
            ctx.fillStyle = "#ffffff"; ctx.fill(); ctx.restore();
        }

        // Corazón central con nombre "REX"
        function crearCorazonRosas(nombre) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 1024; canvas.height = 1024;
            const centerX = 512; const centerY = 450;
            for (let t = 0; t < Math.PI * 2; t += 0.12) {
                const r = 22; 
                const x = centerX + r * (16 * Math.pow(Math.sin(t), 3));
                const y = centerY - r * (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
                dibujarRosaDefinida(ctx, x, y, 0.9);
            }
            ctx.font = "normal 180px 'Great Vibes', cursive";
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillStyle = "#ffffff"; ctx.shadowBlur = 40; ctx.shadowColor = "#ff00ff";
            ctx.fillText(nombre, centerX, centerY + 30);
            return new THREE.CanvasTexture(canvas);
        }

        const misFrases = ["Mi Dulzura 🥰", "Mi Ángel 😇", "Mi Vida ❤️", "Mi Cielo ✨", "Mi Reina 👑", "Mi Todo 💞", "Mi Alegría 😊", "Eres Magia 🪄", "Mi Corazón 💖", "Eternamente ♾️", "Mi Tesoro 💎", "Mi Estrella ⭐"];

        const grupoGalaxia = new THREE.Group();
        for (let i = 0; i < 180; i++) {
            const frase = misFrases[i % misFrases.length];
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: crearTexturaFrase(frase), transparent: true }));
            const r = 130 + Math.random() * 270;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            sprite.position.set(r * Math.sin(phi) * Math.cos(theta), r * Math.sin(phi) * Math.sin(theta), r * Math.cos(phi));
            sprite.scale.set(45, 12, 1);
            grupoGalaxia.add(sprite);
        }
        scene.add(grupoGalaxia);

        // Corazón central REX
        const centroSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: crearCorazonRosas("REX"), transparent: true }));
        centroSprite.scale.set(230, 230, 1); 
        scene.add(centroSprite);

        camera.position.z = 450;

        // Partículas al clic
        const particulas = [];
        const texturasClick = ["❤️", "💖", "🌸", "✨", "🌹"];

        function crearParticulaClick(x, y) {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.font = "32px Arial";
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText(texturasClick[Math.floor(Math.random() * texturasClick.length)], 32, 32);
            
            const tex = new THREE.CanvasTexture(canvas);
            const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
            const p = new THREE.Sprite(mat);
            
            const vector = new THREE.Vector3((x / window.innerWidth) * 2 - 1, -(y / window.innerHeight) * 2 + 1, 0.5);
            vector.unproject(camera);
            const dir = vector.sub(camera.position).normalize();
            const distancia = 200; 
            const pos = camera.position.clone().add(dir.multiplyScalar(distancia));
            
            p.position.copy(pos);
            p.scale.set(15, 15, 1);
            p.userData = { 
                vx: (Math.random() - 0.5) * 2, 
                vy: (Math.random() - 0.5) * 2, 
                vz: (Math.random() - 0.5) * 2,
                vida: 1.0 
            };
            
            scene.add(p);
            particulas.push(p);
        }

        window.addEventListener('pointerdown', (e) => {
            for(let i=0; i<8; i++) crearParticulaClick(e.clientX, e.clientY);
        });

        function animate() {
            requestAnimationFrame(animate);
            
            const tiempo = Date.now() * 0.005;

            // --- EFECTO LATIDO REX ---
            // Oscila entre 220 y 250 de escala
            const escalaLatido = 230 + Math.sin(tiempo * 0.8) * 15;
            centroSprite.scale.set(escalaLatido, escalaLatido, 1);
            // -------------------------

            grupoGalaxia.rotation.y += 0.0008;
            
            // Animación partículas
            for(let i = particulas.length - 1; i >= 0; i--) {
                const p = particulas[i];
                p.position.x += p.userData.vx;
                p.position.y += p.userData.vy;
                p.position.z += p.userData.vz;
                p.userData.vida -= 0.015;
                p.material.opacity = p.userData.vida;
                if(p.userData.vida <= 0) {
                    scene.remove(p);
                    particulas.splice(i, 1);
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
